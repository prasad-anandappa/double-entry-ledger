name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # GitHub-hosted runners provide Docker, so the Testcontainers suite
      # (PostgreSQL) runs here even where a local machine has no daemon.
      - name: Build and verify (unit + integration + Testcontainers)
        run: mvn -B verify
